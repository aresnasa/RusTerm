<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: White App Icon Base — macOS squircle (superellipse n≈5).
         Replaces the previous rx=112 rounded rect with the proper macOS app-icon
         shape so the corners have the "flatter sides, tighter corners" curve
         Apple uses in Big Sur+ instead of a plain CSS-style border radius. -->
    <path id="bg" fill="#FFFFFF" d="M512.000,256.000L511.949,320.131L511.798,340.605L511.545,355.470L511.191,367.549L510.735,377.891L510.176,387.018L509.516,395.231L508.752,402.725L507.885,409.630L506.913,416.042L505.835,422.030L504.652,427.648L503.361,432.938L501.961,437.934L500.451,442.663L498.830,447.148L497.096,451.407L495.246,455.457L493.279,459.311L491.192,462.980L488.983,466.474L486.649,469.802L484.187,472.971L481.592,475.989L478.861,478.861L475.989,481.592L472.971,484.187L469.802,486.649L466.474,488.983L462.980,491.192L459.311,493.279L455.457,495.246L451.407,497.096L447.148,498.830L442.663,500.451L437.934,501.961L432.938,503.361L427.648,504.652L422.030,505.835L416.042,506.913L409.630,507.885L402.725,508.752L395.231,509.516L387.018,510.176L377.891,510.735L367.549,511.191L355.470,511.545L340.605,511.798L320.131,511.949L256.000,512.000L191.869,511.949L171.395,511.798L156.530,511.545L144.451,511.191L134.109,510.735L124.982,510.176L116.769,509.516L109.275,508.752L102.370,507.885L95.958,506.913L89.970,505.835L84.352,504.652L79.062,503.361L74.066,501.961L69.337,500.451L64.852,498.830L60.593,497.096L56.543,495.246L52.689,493.279L49.020,491.192L45.526,488.983L42.198,486.649L39.029,484.187L36.011,481.592L33.139,478.861L30.408,475.989L27.813,472.971L25.351,469.802L23.017,466.474L20.808,462.980L18.721,459.311L16.754,455.457L14.904,451.407L13.170,447.148L11.549,442.663L10.039,437.934L8.639,432.938L7.348,427.648L6.165,422.030L5.087,416.042L4.115,409.630L3.248,402.725L2.484,395.231L1.824,387.018L1.265,377.891L0.809,367.549L0.455,355.470L0.202,340.605L0.051,320.131L0.000,256.000L0.051,191.869L0.202,171.395L0.455,156.530L0.809,144.451L1.265,134.109L1.824,124.982L2.484,116.769L3.248,109.275L4.115,102.370L5.087,95.958L6.165,89.970L7.348,84.352L8.639,79.062L10.039,74.066L11.549,69.337L13.170,64.852L14.904,60.593L16.754,56.543L18.721,52.689L20.808,49.020L23.017,45.526L25.351,42.198L27.813,39.029L30.408,36.011L33.139,33.139L36.011,30.408L39.029,27.813L42.198,25.351L45.526,23.017L49.020,20.808L52.689,18.721L56.543,16.754L60.593,14.904L64.852,13.170L69.337,11.549L74.066,10.039L79.062,8.639L84.352,7.348L89.970,6.165L95.958,5.087L102.370,4.115L109.275,3.248L116.769,2.484L124.982,1.824L134.109,1.265L144.451,0.809L156.530,0.455L171.395,0.202L191.869,0.051L256.000,0.000L320.131,0.051L340.605,0.202L355.470,0.455L367.549,0.809L377.891,1.265L387.018,1.824L395.231,2.484L402.725,3.248L409.630,4.115L416.042,5.087L422.030,6.165L427.648,7.348L432.938,8.639L437.934,10.039L442.663,11.549L447.148,13.170L451.407,14.904L455.457,16.754L459.311,18.721L462.980,20.808L466.474,23.017L469.802,25.351L472.971,27.813L475.989,30.408L478.861,33.139L481.592,36.011L484.187,39.029L486.649,42.198L488.983,45.526L491.192,49.020L493.279,52.689L495.246,56.543L497.096,60.593L498.830,64.852L500.451,69.337L501.961,74.066L503.361,79.062L504.652,84.352L505.835,89.970L506.913,95.958L507.885,102.370L508.752,109.275L509.516,116.769L510.176,124.982L510.735,134.109L511.191,144.451L511.545,156.530L511.798,171.395L511.949,191.869Z"/>

    <!-- Light Drop Shadow for the App Icon -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- Golden Gradients for the Shield -->
    <linearGradient id="shieldOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A0"/>
      <stop offset="100%" stop-color="#DCA032"/>
    </linearGradient>
    
    <!-- Left side of shield (lighter) -->
    <linearGradient id="shieldLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFECA4"/>
      <stop offset="100%" stop-color="#ECC659"/>
    </linearGradient>

    <!-- Right side of shield (darker for 3D effect) -->
    <linearGradient id="shieldRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBBF47"/>
      <stop offset="100%" stop-color="#C5871D"/>
    </linearGradient>

    <!-- Gemini-style Azure Gradient for the Star -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56DDFB"/>
      <stop offset="100%" stop-color="#2185EE"/>
    </linearGradient>

    <!-- Shadow for inner elements -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- App Icon Base — fills the full canvas (macOS squircle-style background).
       NOT scaled: the background tile must fill the canvas so macOS renders the
       icon at the standard Dock/Cmd-Tab tile size. -->
  <g filter="url(#appShadow)">
    <use href="#bg"/>
  </g>

  <!-- Artwork — scaled to ~85% and centered within the canvas. Iteration
       history: 65% left too much white border; 76% was a compromise but the
       white squircle margin around the shield was still visually excessive
       (especially in the WebView favicon); 85% noticeably reduces the white
       border while keeping the artwork from filling the squircle edge-to-edge.
       The background squircle above still fills the full canvas so macOS
       renders the tile at the standard size. -->
  <g transform="translate(256, 256) scale(0.85) translate(-256, -256)">

    <!-- Shield Outer Stroke (Dark Gold/Brown) -->
    <path d="M256 80 
             L416 110 
             L416 260 
             C416 360 330 430 256 460 
             C182 430 96 360 96 260 
             L96 110 Z" 
          fill="url(#shieldOuterGrad)" 
          stroke="#5C421A" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Shield Inner Left (Lighter Gold) -->
    <path d="M256 100 
             L116 126 
             L116 260 
             C116 348 190 408 256 434 Z" 
          fill="url(#shieldLeftGrad)"/>

    <!-- Shield Inner Right (Darker Gold) -->
    <path d="M256 100 
             L396 126 
             L396 260 
             C396 348 322 408 256 434 Z" 
          fill="url(#shieldRightGrad)"/>

    <!-- Stylized Terminal Abstract Elements -->
    <g transform="translate(136, 150)" stroke="#3E2B10" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Top abstract terminal prompt/input lines -->
      <polyline points="10,20 30,40 10,60" fill="none" stroke-width="14" stroke-opacity="0.9"/>
      
      <!-- Code logic/path abstract lines (Changed to all straight horizontal lines) -->
      <line x1="60" y1="20" x2="130" y2="20" stroke-width="12" stroke-opacity="0.8"/>
      <line x1="60" y1="40" x2="100" y2="40" stroke-width="12" stroke-opacity="0.8"/>
      <line x1="60" y1="60" x2="140" y2="60" stroke-width="12" stroke-opacity="0.8"/>
      <line x1="60" y1="80" x2="110" y2="80" stroke-width="12" stroke-opacity="0.8"/>

      <!-- Green abstract blocks (Rust speed/success) -->
      <rect x="10" y="100" width="80" height="24" rx="12" fill="#78D668" stroke-width="8"/>
      <rect x="10" y="140" width="70" height="24" rx="12" fill="#78D668" stroke-width="8"/>
      <rect x="10" y="180" width="90" height="24" rx="12" fill="#4CAF50" stroke-width="8"/> 
      <rect x="30" y="220" width="80" height="24" rx="12" fill="#4CAF50" stroke-width="8"/> 

      <!-- Blue abstract blocks (Memory/Data flow) -->
      <rect x="100" y="100" width="90" height="24" rx="12" fill="#5AA6F7" stroke-width="8"/>
      <rect x="90" y="140" width="100" height="24" rx="12" fill="#5AA6F7" stroke-width="8"/>
      <rect x="110" y="180" width="70" height="24" rx="12" fill="#3B82F6" stroke-width="8"/> 
      <rect x="120" y="220" width="60" height="24" rx="12" fill="#3B82F6" stroke-width="8"/> 
    </g>

    <!-- The Smart AI Star (Gemini style) moved to the top right corner inside the shield -->
    <g transform="translate(290, 120) scale(0.75)" filter="url(#innerShadow)">
      <path d="M 60 0 
               C 60 40, 80 60, 120 60 
               C 80 60, 60 80, 60 120 
               C 60 80, 40 60, 0 60 
               C 40 60, 60 40, 60 0 Z" 
            fill="url(#starGrad)" 
            stroke="#003366" 
            stroke-width="8" 
            stroke-linejoin="round"/>
    </g>

  </g>

</svg>
