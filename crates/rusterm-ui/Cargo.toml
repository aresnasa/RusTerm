[package]
name = "rusterm-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus.workspace = true
dioxus-router.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
parking_lot.workspace = true
vte = { workspace = true, features = ["ansi"] }
regex.workspace = true
arboard.workspace = true
rfd.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
axum.workspace = true
qrcode.workspace = true

rusterm-core.workspace = true
rusterm-ssh.workspace = true
rusterm-relay.workspace = true
rusterm-tunnel.workspace = true
rusterm-crypto.workspace = true
rusterm-db.workspace = true
rusterm-ai.workspace = true
rusterm-plugins.workspace = true
rusterm-proto.workspace = true
rusterm-history.workspace = true
rusterm-ohmyzsh.workspace = true
rusterm-zmodem.workspace = true
# Analytics (DuckDB-backed OLAP layer). Optional because the bundled DuckDB
# C++ library adds ~50MB to the binary — users who don't want the analytics
# panel can build without this feature and pay no cost. When disabled, the
# `rusterm_ui::analytics` module is stubbed out (returns empty results).
rusterm-analytics = { workspace = true, optional = true }

[features]
default = []
## Enable the DuckDB-backed analytics layer (crates/rusterm-analytics).
## Adds ~50MB to the binary due to the bundled libduckdb C++ library.
## When disabled, analytics queries return empty results and no DuckDB
## connection is opened.
analytics = ["dep:rusterm-analytics"]
## Enable local on-device LLM template generation (Qwen2.5-Coder-1.5B).
## Pulls in the candle dependency tree (~heavy). When disabled, the API
## panel's "AI Generate" button is hidden.
qwen-local = ["rusterm-ai/qwen-local"]
## Metal GPU acceleration for the local model (macOS only).
qwen-local-metal = ["qwen-local", "rusterm-ai/qwen-local-metal"]
## CUDA GPU acceleration for the local model.
qwen-local-cuda = ["qwen-local", "rusterm-ai/qwen-local-cuda"]

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
